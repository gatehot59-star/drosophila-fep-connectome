name: a1-prueba
# Respuesta 2026-11-03-005. Humo del runner 009-A1 real sin tocar el plan: huellas de lo commiteado, censo con
# entradas fijadas, manifiesto commiteado antes de cualquier ensayo (y comparado con el de brain-env), pruebas del
# fixture con Brian2 cython, 10 ensayos de humo con semillas 900 y 901 (fuera del contrato 0..19) y validacion del
# productor. Cada intento escribe solo en results/a1_2026-11-03/prueba_<N> y se niega a repetir uno existente.
on:
  push:
    branches: ["titan/a1-runner-2026-11-03"]
    paths: ["tools/a1/PROBAR"]
permissions:
  contents: write
concurrency:
  group: a1-prueba
  cancel-in-progress: false
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==25.0.1
  LIFDEPS: brian2==2.10.1 cython==3.1.3 joblib==1.6.0
  SHIU: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
  ANNOT_URL: https://raw.githubusercontent.com/flyconnectome/flywire_annotations/17fc57722002e1a7d38cdd0c89ac382bf92718da/supplemental_files/Supplemental_file1_neuron_annotations.tsv
  BANC: https://storage.googleapis.com/lee-lab_brain-and-nerve-cord-fly-connectome/compiled_data/banc_888
  MAIN_EVID: https://raw.githubusercontent.com/gatehot59-star/drosophila-fep-connectome/28c52c61134c26fd71b4a0df39751fcb885e96d4
  MANIFIESTO_BRAIN_ENV: 267ca1d0820193fff08a79875a1d1bd6a36d8633e203db9e0ee3d7304c5e3dd9
  L: /tmp/a1logs
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: intento, huellas y negativa a repetir
        id: intento
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$L"
          exec > >(tee "$L/intento.log") 2>&1
          printf 'UTC_START '; date -u --iso-8601=seconds
          printf 'SOURCE_COMMIT '; git rev-parse HEAD
          printf 'RUN %s ATTEMPT %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          N=$(sed -n 's/^intento=\([0-9][0-9]*\)$/\1/p' tools/a1/PROBAR | head -1)
          if [ -z "$N" ]; then echo 'REFUSE: tools/a1/PROBAR no dice intento=N'; exit 4; fi
          D="results/a1_2026-11-03/prueba_$N"
          if [ -e "$D" ]; then echo "REFUSE: $D ya existe; un intento no se repite"; exit 4; fi
          mkdir -p "$D"
          echo "$D" > /tmp/a1_propio
          echo "D=$D" >> "$GITHUB_ENV"
          echo "N=$N" >> "$GITHUB_ENV"
          echo "INTENTO $N DIR $D"
          sha256sum --check tools/a1/HUELLAS.sha256
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: censo con entradas fijadas
        id: censo
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$L/censo.log") 2>&1
          printf 'UTC_START '; date -u --iso-8601=seconds
          python -m pip install $DEPS $LIFDEPS
          python -m pip freeze > "$L/pip_freeze.txt"
          { nproc; free -m; g++ --version | head -1; python --version; uname -a; } > "$L/maquina.txt" 2>&1
          sudo mkdir -p /workspace/banc_888 /workspace/mecanismo-2026-11-02 /workspace/a1/shiu /workspace/a1/in /workspace/a1/fx
          sudo chown -R "$USER" /workspace
          curl -fsSL --retry 2 --max-time 300 -o /workspace/connectivity.parquet "$SHIU/Connectivity_783.parquet"
          curl -fsSL --retry 2 --max-time 300 -o /workspace/a1/in/completeness.csv "$SHIU/Completeness_783.csv"
          curl -fsSL --retry 2 --max-time 300 -o /workspace/a1/shiu/model.py "$SHIU/model.py"
          curl -fsSL --retry 2 --max-time 300 -o /workspace/annotations.tsv "$ANNOT_URL"
          curl -fsSL --retry 2 --max-time 300 -o /workspace/banc_888/banc_888_meta.feather "$BANC/banc_888_meta.feather"
          curl -fsSL --retry 2 --max-time 900 -o /workspace/banc_888/banc_888_edgelist_simple_v3.feather "$BANC/banc_888_edgelist_simple_v3.feather"
          curl -fsSL --retry 2 --max-time 300 -o /workspace/a1/in/sello_diseno_16_relevos.json "$MAIN_EVID/docs/auditorias/evidencia/2026-11-02-02/sello_diseno_16_relevos.json"
          curl -fsSL --retry 2 --max-time 300 -o /workspace/a1/in/evid010.md "$MAIN_EVID/docs/agents/evidencia/2026-11-02-010-guardas-enmienda-009-a1.md"
          cp tools/reuso/reuso_mosca.py tools/mecanismo/paso12.py /workspace/mecanismo-2026-11-02/
          printf '%s\n' \
            'efeb23fb99098e9c390f6869969b2a121a2ee92c833cfc45ecb2c1d8e1af0347  /workspace/connectivity.parquet' \
            'bbb847a4cc2caaa7a16349722d220c087317b946d148d4d592d94d250617a311  /workspace/a1/in/completeness.csv' \
            'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  /workspace/a1/shiu/model.py' \
            '9a4f8b2f843196074431ebd7cd883536afa1be86c8a4ce90970441e8be81d1be  /workspace/annotations.tsv' \
            '86ccf5df0c67419f8c5f43e93a7ed38d23a080e9f7fde26737290252f3780098  /workspace/banc_888/banc_888_meta.feather' \
            '8c296e946f3c69a8c7222f30ad75fa8a98eeb189124fec6df829c9125f4be64b  /workspace/banc_888/banc_888_edgelist_simple_v3.feather' \
            '210b581792d183517d1e4e7771b8435e4a6acb537bc1ad383e5725c500073e93  /workspace/a1/in/sello_diseno_16_relevos.json' \
            'd5d9b7bad373c13bc240581153fbef8820e2d5587979b263a7908e76daa4eeb8  /workspace/a1/in/evid010.md' \
            'b604af62e053cacded85979002b34d70ca104d5399cfba1b8135a6626bf784eb  /workspace/mecanismo-2026-11-02/paso12.py' \
            | sha256sum --check -
          python /workspace/mecanismo-2026-11-02/paso12.py > "$L/paso12.log" 2>&1 || { tail -60 "$L/paso12.log"; exit 3; }
          grep -E '^(PARITY|LOADED|DONE)' "$L/paso12.log" || true
          sha256sum /workspace/mecanismo-2026-11-02/flywire_units.npz
          printf 'UTC_END '; date -u --iso-8601=seconds
      - name: manifiesto commiteado antes de cualquier ensayo
        id: manifiesto
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$L/manifiesto.log") 2>&1
          python tools/a1/manifiesto_a1.py --parquet /workspace/connectivity.parquet --units /workspace/mecanismo-2026-11-02/flywire_units.npz --sello /workspace/a1/in/sello_diseno_16_relevos.json --evid010 /workspace/a1/in/evid010.md --salida "$D/manifiesto_a1.json"
          SHA=$(sha256sum "$D/manifiesto_a1.json" | cut -d' ' -f1)
          echo "$SHA  manifiesto_a1.json" > "$D/MANIFIESTO.sha256"
          echo "SHA_MAN=$SHA" >> "$GITHUB_ENV"
          if [ "$SHA" = "$MANIFIESTO_BRAIN_ENV" ]; then echo "MANIFIESTO_IGUAL_A_BRAIN_ENV $SHA"; else echo "MANIFIESTO_DISTINTO_DE_BRAIN_ENV actions=$SHA brain_env=$MANIFIESTO_BRAIN_ENV"; fi
          cp "$L"/*.log "$L"/*.txt "$D"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -q -m "sello(2026-11-03-005): manifiesto 009-A1 del intento $N antes de cualquier ensayo, run $GITHUB_RUN_ID"
          git pull -q --rebase --autostash origin "$GITHUB_REF_NAME"
          git push -q origin HEAD:"$GITHUB_REF_NAME"
          echo "MANIFIESTO_COMMITEADO $(git rev-parse HEAD)"
          test "$SHA" = "$MANIFIESTO_BRAIN_ENV"
      - name: pruebas del fixture con Brian2 cython
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$L/prueba_cython.log") 2>&1
          python tools/a1/prueba_a1.py --shiu /workspace/a1/shiu --target cython --trabajo /workspace/a1/fx --n-proc 3 --manifiesto-real "$D/manifiesto_a1.json"
      - name: humo con semillas fuera del contrato
        id: humo
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$L/humo.log") 2>&1
          if [ -x /usr/bin/time ]; then TV="/usr/bin/time -v"; else TV=""; fi
          $TV python tools/a1/runner_a1.py --manifiesto "$D/manifiesto_a1.json" --sha-manifiesto "$SHA_MAN" --humo --shiu /workspace/a1/shiu --comp /workspace/a1/in/completeness.csv --conn /workspace/connectivity.parquet --units /workspace/mecanismo-2026-11-02/flywire_units.npz --salida "$D/registros_humo" --n-proc 3 --target cython --code-commit "$GITHUB_SHA"
      - name: validacion del productor sobre el humo
        id: validar
        if: always() && steps.humo.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$L/validar_humo.log") 2>&1
          python tools/a1/validar_a1.py --manifiesto "$D/manifiesto_a1.json" --sha-manifiesto "$SHA_MAN" --registros "$D/registros_humo" --humo --salida "$D/validacion_humo.json"
      - name: conservar el intento
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/a1_propio ]; then echo 'Sin directorio propio: nada que conservar'; exit 0; fi
          D=$(cat /tmp/a1_propio)
          cp "$L"/*.log "$L"/*.txt "$D"/ 2>/dev/null || true
          if [ -d /workspace/a1/fx ]; then
            cp -r /workspace/a1/fx "$D/fixture_cython"
            find "$D/fixture_cython" -type f \( -name '*.npz' -o -name '*.parquet' \) -delete
          fi
          printf 'run=%s dir=%s fuente=%s job=%s intento=%s censo=%s manifiesto=%s fixtures=%s humo=%s validar=%s\n' \
            "$GITHUB_RUN_ID" "$D" "$GITHUB_SHA" "${{ job.status }}" "${{ steps.intento.outcome }}" "${{ steps.censo.outcome }}" \
            "${{ steps.manifiesto.outcome }}" "${{ steps.fixtures.outcome }}" "${{ steps.humo.outcome }}" "${{ steps.validar.outcome }}" > "$D/RESULTADO.txt"
          { printf 'UTC_END '; date -u --iso-8601=seconds; } >> "$D/RESULTADO.txt"
          (cd "$D" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -q -m "medicion(2026-11-03-005): humo 009-A1 en $D, run $GITHUB_RUN_ID" || true
          git pull -q --rebase --autostash origin "$GITHUB_REF_NAME"
          git push -q origin HEAD:"$GITHUB_REF_NAME"
