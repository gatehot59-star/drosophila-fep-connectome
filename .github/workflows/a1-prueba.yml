name: a1-prueba
on:
  push:
    branches: ["titan/a1-runner-2026-11-03"]
    paths: ["tools/a1/PROBAR"]
permissions: {contents: write}
concurrency: {group: a1-prueba, cancel-in-progress: false}
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==25.0.1
  LIFDEPS: brian2==2.10.1 cython==3.1.3 joblib==1.6.0
  SHIU: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with: {python-version: "3.12.14"}
    - name: fixtures
      run: |
        set -euo pipefail
        python -m pip install $DEPS $LIFDEPS
        python tools/a1/prueba_a1.py
    - name: manifest and smoke
      run: |
        set -euo pipefail
        mkdir -p results/a1_prueba /workspace/banc_888 /workspace/mecanismo-2026-11-02
        curl -fsSL --retry 2 -o /workspace/connectivity.parquet "$SHIU/Connectivity_783.parquet"
        curl -fsSL --retry 2 -o /workspace/annotations.tsv "https://raw.githubusercontent.com/flyconnectome/flywire_annotations/17fc57722002e1a7d38cdd0c89ac382bf92718da/supplemental_files/Supplemental_file1_neuron_annotations.tsv"
        curl -fsSL --retry 2 -o /workspace/banc_888/banc_888_meta.feather "https://storage.googleapis.com/lee-lab_brain-and-nerve-cord-fly-connectome/compiled_data/banc_888/banc_888_meta.feather"
        curl -fsSL --retry 2 -o /workspace/banc_888/banc_888_edgelist_simple_v3.feather "https://storage.googleapis.com/lee-lab_brain-and-nerve-cord-fly-connectome/compiled_data/banc_888/banc_888_edgelist_simple_v3.feather"
        cp tools/reuso/reuso_mosca.py tools/mecanismo/paso12.py /workspace/mecanismo-2026-11-02/
        python /workspace/mecanismo-2026-11-02/paso12.py >/tmp/paso12.log 2>&1
        python tools/a1/manifiesto_a1.py --parquet /workspace/connectivity.parquet --units /workspace/mecanismo-2026-11-02/flywire_units.npz --sello docs/auditorias/evidencia/2026-11-02-02/sello_diseno_16_relevos.json --out results/a1_prueba/manifiesto.json
        sha256sum results/a1_prueba/manifiesto.json | tee results/a1_prueba/MANIFEST.sha256
        git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add results/a1_prueba/manifiesto.json results/a1_prueba/MANIFEST.sha256
        git commit -m "sello(2026-11-03): manifiesto A1 antes de actividad"
        git pull --rebase origin "$GITHUB_REF_NAME"; git push origin HEAD:"$GITHUB_REF_NAME"
        python tools/a1/runner_a1.py --manifest results/a1_prueba/manifiesto.json --out results/a1_prueba/recibo_smoke.json
    - name: conservar resultado
      if: always()
      run: |
        set -euo pipefail
        mkdir -p results/a1_prueba
        printf 'run=%s status=%s sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_JOB" "$GITHUB_SHA" > results/a1_prueba/RESULTADO.txt
        (cd results/a1_prueba && find . -type f ! -name MD5SUMS.txt -print0 | sort -z | xargs -0 md5sum > MD5SUMS.txt)
        git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add results/a1_prueba; git commit -m "medicion(2026-11-03): fixtures y manifest A1" || true
        git pull --rebase origin "$GITHUB_REF_NAME"; git push origin HEAD:"$GITHUB_REF_NAME"
