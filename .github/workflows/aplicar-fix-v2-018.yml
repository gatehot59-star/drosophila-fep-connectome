name: aplicar-fix-v2-018
# Aplica tools/v2/fix_v2_018.py sobre esta rama, commitea el resultado con su log y se retira.
# Respuesta 2026-10-12-018. Se dispara solo con el push que trae este archivo.
on:
  push:
    branches: [titan/v2-cierre-2026-10-12]
    paths: [.github/workflows/aplicar-fix-v2-018.yml]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: titan/v2-cierre-2026-10-12
      - name: aplicar el parche de la 018
        shell: bash
        run: |
          python3 --version | tee docs/v2/fix-v2-018.log
          md5sum tools/v2/fix_v2_018.py | tee -a docs/v2/fix-v2-018.log
          python3 tools/v2/fix_v2_018.py . | tee -a docs/v2/fix-v2-018.log
          md5sum docs/v2/paper1-v2.0.md docs/ERRATUM.md docs/SECCION-V2-DOS-SALTOS.md docs/v2/zenodo-v2.0-metadata.json | tee -a docs/v2/fix-v2-018.log
      - name: commitear y retirar el workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/aplicar-fix-v2-018.yml
          git add docs/v2/paper1-v2.0.md docs/ERRATUM.md docs/SECCION-V2-DOS-SALTOS.md docs/v2/zenodo-v2.0-metadata.json docs/v2/fix-v2-018.log
          git commit -q -m "docs(v2): corrige las tres inconsistencias de la 010 con tools/v2/fix_v2_018.py, aplicado en Actions (respuesta 2026-10-12-018)"
          git push -q origin HEAD:titan/v2-cierre-2026-10-12
