name: arranque-2026-10-14-060
# Respuesta 2026-10-14-060: genera docs/agents/INDICE-COMPLETO-GIT.md con tools/arranque/generar_indice.py; el workflow se borra en el mismo commit.
on:
  push:
    branches: ["main"]
    paths: ["tools/arranque/generar_indice.py"]
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: generar el indice y borrar este workflow
        shell: bash
        run: |
          set -e
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          python3 tools/arranque/generar_indice.py --repo . --salida docs/agents/INDICE-COMPLETO-GIT.md | tee /tmp/gen.log
          md5sum tools/arranque/generar_indice.py docs/agents/INDICE-COMPLETO-GIT.md | tee -a /tmp/gen.log
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/arranque-2026-10-14-060.yml
          git add docs/agents/INDICE-COMPLETO-GIT.md
          git commit -m "indice(2026-10-14-060): INDICE-COMPLETO-GIT generado en Actions" -m "$(cat /tmp/gen.log)"
          git pull --rebase origin main || true
          git push origin HEAD:main
