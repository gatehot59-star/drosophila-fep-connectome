name: cierre2-2026-10-14-061
# Respuesta 2026-10-14-061: un solo link a la tarea de Tao en el ARRANQUE y la segunda vuelta de la prueba (tools/arranque/cierre2_2026-10-14-061.py); el workflow se borra en el mismo commit.
on:
  push:
    branches: ["main"]
    paths: ["tools/arranque/cierre2_2026-10-14-061.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aplicar el segundo cierre y borrar este workflow
        shell: bash
        run: |
          python3 tools/arranque/cierre2_2026-10-14-061.py | tee /tmp/cierre2.log
          echo "blob ARRANQUE $(git hash-object docs/agents/ARRANQUE-NUEVO-CHAT.md)" | tee -a /tmp/cierre2.log
          echo "blob 061 $(git hash-object docs/agents/respuestas/2026-10-14-061-arranque-corregido-y-h-pares-datos-medido.md)" | tee -a /tmp/cierre2.log
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/cierre2-2026-10-14-061.yml
          git add docs/agents/ARRANQUE-NUEVO-CHAT.md docs/agents/respuestas/2026-10-14-061-arranque-corregido-y-h-pares-datos-medido.md
          git commit -m "cierre(2026-10-14-061): un solo link a la tarea de Tao en el ARRANQUE y la segunda vuelta de la prueba, aplicado en Actions" -m "$(cat /tmp/cierre2.log)"
          git pull --rebase origin main || true
          git push origin HEAD:main
