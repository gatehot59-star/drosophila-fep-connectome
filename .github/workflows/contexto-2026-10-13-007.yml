name: contexto-2026-10-13-007
# Respuesta 2026-10-13-007: aplica tools/contexto/actualizar_contexto_2026-10-13-007.py al CONTEXTO y se retira.
on:
  push:
    branches: ["main"]
    paths: ["tools/contexto/actualizar_contexto_2026-10-13-007.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aplicar el parche y retirarse
        shell: bash
        run: |
          python3 tools/contexto/actualizar_contexto_2026-10-13-007.py docs/agents/CONTEXTO-drosophila-fep.md
          md5sum docs/agents/CONTEXTO-drosophila-fep.md
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/contexto-2026-10-13-007.yml
          git add docs/agents/CONTEXTO-drosophila-fep.md
          git commit -m "contexto(2026-10-13-007): CONTEXTO al dia con F01, F06 y F07 aplicados (006) y el factorial 2 leido (007), aplicado en Actions"
          git push origin HEAD:main
