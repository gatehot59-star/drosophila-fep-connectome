name: contexto-2026-10-14-005
# Respuesta 2026-10-14-005: aplica tools/contexto/actualizar_contexto_2026-10-14-005.py al CONTEXTO y se retira.
on:
  push:
    branches: ["main"]
    paths: ["tools/contexto/actualizar_contexto_2026-10-14-005.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aplicar el parche y retirarse
        shell: bash
        run: |
          python3 tools/contexto/actualizar_contexto_2026-10-14-005.py docs/agents/CONTEXTO-drosophila-fep.md
          md5sum docs/agents/CONTEXTO-drosophila-fep.md
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/contexto-2026-10-14-005.yml
          git add docs/agents/CONTEXTO-drosophila-fep.md
          git commit -m "contexto(2026-10-14-005): CONTEXTO al dia con el esqueleto del Paper 2, aplicado en Actions"
          git pull --rebase origin main || true
          git push origin HEAD:main
