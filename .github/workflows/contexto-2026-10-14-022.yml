name: contexto-2026-10-14-022
# Respuesta 2026-10-14-022: espera a que el parche 021 este en main, aplica el 022 al CONTEXTO y se retira.
on:
  push:
    branches: ["main"]
    paths: ["tools/contexto/actualizar_contexto_2026-10-14-022.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: esperar al 021, aplicar el parche y retirarse
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 280); do
            git pull -q --rebase origin main || true
            if grep -q "con la respuesta 2026-10-14-021" docs/agents/CONTEXTO-drosophila-fep.md; then echo "021 en main"; break; fi
            sleep 60
          done
          python3 tools/contexto/actualizar_contexto_2026-10-14-022.py docs/agents/CONTEXTO-drosophila-fep.md
          md5sum docs/agents/CONTEXTO-drosophila-fep.md
          git rm -q .github/workflows/contexto-2026-10-14-022.yml
          git add docs/agents/CONTEXTO-drosophila-fep.md
          git commit -m "contexto(2026-10-14-022): CONTEXTO al dia con H_TOPO_FIEL refutada en brain-env, aplicado en Actions"
          git pull --rebase origin main || true
          git push origin HEAD:main
