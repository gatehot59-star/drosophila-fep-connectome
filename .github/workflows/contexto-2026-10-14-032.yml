name: contexto-2026-10-14-032
# Respuesta 2026-10-14-032: parche del CONTEXTO con las respuestas 030 a 032 (tools/contexto/actualizar_contexto_2026-10-14-032.py); el workflow se borra en el mismo commit.
on:
  push:
    branches: ["main"]
    paths: ["tools/contexto/actualizar_contexto_2026-10-14-032.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aplicar el parche y borrar este workflow
        shell: bash
        run: |
          python3 tools/contexto/actualizar_contexto_2026-10-14-032.py docs/agents/CONTEXTO-drosophila-fep.md
          md5sum docs/agents/CONTEXTO-drosophila-fep.md
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/contexto-2026-10-14-032.yml
          git add docs/agents/CONTEXTO-drosophila-fep.md
          git commit -m "contexto(2026-10-14-032): CONTEXTO al dia con 030 a 032 (H_REUSO SOSTENIDA, H_DEBILES INVALIDO, regla de no citar descriptivos invalidos, H_RIVAL sellado), aplicado en Actions"
          git pull --rebase origin main || true
          git push origin HEAD:main
