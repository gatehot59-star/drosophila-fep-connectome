name: contexto-2026-10-14-034
# Respuesta 2026-10-14-034: parche del CONTEXTO (tools/contexto/actualizar_contexto_2026-10-14-034.py); el workflow se borra en el mismo commit.
on:
  push:
    branches: ["main"]
    paths: ["tools/contexto/actualizar_contexto_2026-10-14-034.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aplicar el parche y borrar este workflow
        shell: bash
        run: |
          python3 tools/contexto/actualizar_contexto_2026-10-14-034.py docs/agents/CONTEXTO-drosophila-fep.md
          md5sum docs/agents/CONTEXTO-drosophila-fep.md
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/contexto-2026-10-14-034.yml
          git add docs/agents/CONTEXTO-drosophila-fep.md
          git commit -m "contexto(2026-10-14-034): CONTEXTO al dia con H_RIVAL REFUTADA, H_TAU_JUSTO SIN_DECIDIR y el borrador de la v2 en Zenodo, aplicado en Actions"
          git pull --rebase origin main || true
          git push origin HEAD:main
