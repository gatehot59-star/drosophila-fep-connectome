name: contexto-2026-10-14-035
# Respuesta 2026-10-14-035: parche del CONTEXTO (tools/contexto/actualizar_contexto_2026-10-14-035.py); el workflow se borra en el mismo commit.
on:
  push:
    branches: ["main"]
    paths: ["tools/contexto/actualizar_contexto_2026-10-14-035.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aplicar el parche y borrar este workflow
        shell: bash
        run: |
          python3 tools/contexto/actualizar_contexto_2026-10-14-035.py docs/agents/CONTEXTO-drosophila-fep.md
          md5sum docs/agents/CONTEXTO-drosophila-fep.md
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/contexto-2026-10-14-035.yml
          git add docs/agents/CONTEXTO-drosophila-fep.md
          git commit -m "contexto(2026-10-14-035): CONTEXTO al dia con la v2 del Paper 1 publicada y la auditoria del Paper 2 y el 3 contra H_RIVAL, aplicado en Actions"
          git pull --rebase origin main || true
          git push origin HEAD:main
