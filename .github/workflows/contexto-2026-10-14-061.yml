name: contexto-2026-10-14-061
# Respuesta 2026-10-14-061: parche del CONTEXTO (tools/contexto/actualizar_contexto_2026-10-14-061.py); el workflow se borra en el mismo commit y deja en el mensaje del commit los md5 del CONTEXTO y del ARRANQUE y el SHA del blob del ARRANQUE.
on:
  push:
    branches: ["main"]
    paths: ["tools/contexto/actualizar_contexto_2026-10-14-061.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aplicar el parche y borrar este workflow
        shell: bash
        run: |
          python3 tools/contexto/actualizar_contexto_2026-10-14-061.py docs/agents/CONTEXTO-drosophila-fep.md | tee /tmp/parche.log
          md5sum docs/agents/CONTEXTO-drosophila-fep.md docs/agents/ARRANQUE-NUEVO-CHAT.md | tee -a /tmp/parche.log
          echo "blob ARRANQUE $(git hash-object docs/agents/ARRANQUE-NUEVO-CHAT.md)" | tee -a /tmp/parche.log
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/contexto-2026-10-14-061.yml
          git add docs/agents/CONTEXTO-drosophila-fep.md
          git commit -m "contexto(2026-10-14-061): CONTEXTO al dia con H_PARES_DATOS medido, la 060, su auditoria y el ARRANQUE corregido, aplicado en Actions" -m "$(cat /tmp/parche.log)"
          git pull --rebase origin main || true
          git push origin HEAD:main
