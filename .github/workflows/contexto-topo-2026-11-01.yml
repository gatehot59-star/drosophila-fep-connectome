name: contexto-topo-2026-11-01

on:
  push:
    branches: ["titan/contexto-topo-2026-11-01"]
    paths: [".github/workflows/contexto-topo-2026-11-01.yml"]

permissions:
  contents: write

concurrency:
  group: contexto-topo-2026-11-01
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Leer main sin incorporar la rama del instrumento
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Verificar anclas, probar rechazos y escribir solo documentacion
        shell: bash
        env:
          CONTEXTO_MODE: apply
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          TEXT_CHANGES = [('**Última actualización:**', '**Última actualización:** 2026-11-02 (America/Buenos_Aires), respuesta 2026-11-02-001: H_REUSO_CIERRE leído y verificado sin relanzar la corrida del 1-nov. SOSTENIDA en FlyWire y BANC, con recibo VÁLIDO. La sección «1-nov-2026 · Topo inverso corregido» incorpora este cierre y manda sobre sus pendientes anteriores; para los demás temas conserva la prioridad «Madrugada y mañana del 13-oct», seguida por «Tarde y noche del 12-oct (010 a 018)». G1 sigue sin diseño, implementación ni corrida.'), ('**Estado canónico:**', '**Estado canónico:** main, con auditorías 2026-11-01-01/02, respuestas 2026-11-01-001 a 005 y 2026-11-02-001. El rótulo provisional 2026-11-01-006 del Doc se cierra en la respuesta del 2-nov, sin retrodatación. Código y resultados siguen en titan/reuso-estricto-2026-11-01 y titan/reuso-cierre-2026-11-01, sin merge. H4 auditado en a4f5a8e9143173bf609eff430bcca3d5d8699c48.'), ('- **H_REUSO_ESTRICTO VÁLIDA y SOSTENIDA en ambos conectomas:**', '- **H_REUSO_ESTRICTO VÁLIDA y SOSTENIDA en ambos conectomas:** [respuesta 2026-11-01-005](respuestas/2026-11-01-005-reuso-estricto-sostenido-en-flywire-y-banc.md). Sello `750f89a`, fuente `5497aa5`, resultado `0bc09b6`, verificador `6db5d08`; run 41320710194 completed/success. 200 nulos por conectoma, 400/400 completos y válidos. FlyWire: T1 880/996 = 88,35 % contra media 61,17 % y máximo 64,22 %; T2 698 contra media 565,02 y máximo 607. BANC: T1 622/753 = 82,60 % contra media 35,68 % y máximo 39,68 %; T2 419 contra media 112,385 y máximo 141. Cero superaciones en cada prueba; p = 1/201, Holm = 4/201 = 0,0199004975, no p = 0. El presupuesto saliente por clase no elimina el exceso bajo este nulo.\n- **Corrección de la auditoría 2026-11-01-02:** en FlyWire el exceso ESTRICTO es de proporción y reuso, no cantidad: 880 pares con plantilla reales frente a 932 a 1.060 nulos; denominador real 996 frente a 1.582 a 1.682. El QA de 005 es 56/60 = 93,3/100, no 58/60. Misma instancia, no auditoría independiente.\n- **H_REUSO_CIERRE VÁLIDA y SOSTENIDA en ambas moscas:** [respuesta 2026-11-02-001](respuestas/2026-11-02-001-reuso-cierre-verificado-sin-relanzar.md). Sello a2bf422, fuente f734a23, resultados 7f3cbc1; run 41330973057 completed/success, intento 1. 200 nulos por conectoma, denominadores fijos 996/753, presupuestos por clase/lado/signo/rol y filas S→D fijas. FlyWire: 880 pares reales frente a 457 a 524 (media 494,62), T1 88,35 % frente a media 49,66 %, T2 698 frente a media 286,04 y máximo 326. BANC: 622 frente a 233 a 286 (media 263,63), T1 82,60 % frente a media 35,01 %, T2 419 frente a media 76,515 y máximo 95. Cuatro p = 1/201 y Holm = 4/201 = 0,0199004975.\n- **Verificación del cierre, no nueva corrida:** JSON/log 400/400, seis corrupciones rechazadas, diez resúmenes recalculados. REPRO_ESTRICTO PASS registrado por el runner: 400 huellas iguales y estadísticas 0/199 concordantes por dos vías; hoy se verificó el recibo, no se regeneraron grafos. El cierre original consumió 651,36 s y 2,923 GiB RSS en Actions x64, no es costo de G1. El nulo estricto diluía las salidas hacia X; el cierre las conserva. Signo, roles y cableado fijo cambiaron juntos: no se atribuye causalmente la diferencia sólo al signo.'), ('- **Paso habilitado, no ejecutado:**', '- **Después del cierre, todavía no ejecutado:** G1 sigue sin diseño. El motivo conserva su candidatura anatómica frente al nulo por clase/lado/signo/rol con S→D fijo, no una gramática funcional ni ventaja sobre G0. Una futura comparación debe reservar anatomía, igualar interfaces y presupuestos y separar anatomía, función, descripción y ejecución. Inferencia por superclase, signos desconocidos, geometría, fuerza entrante/vecinos únicos y negativos con MOSCA_L siguen pendientes.'), ('- **Alcance y precedencia:**', '- **Alcance y precedencia:** la 004 autorizó lectura; la 005 ejecutó H_REUSO_ESTRICTO; la auditoría 02 motivó H_REUSO_CIERRE, ejecutado el 1-nov y verificado en 2026-11-02-001 por el pedido «Verificá ahora el resultado terminado, sin relanzarlo». No hubo nuevos sorteos, cambios de diseño, GPU, Kaggle, merge ni borrado de ramas. Los pendientes de lectura de cierre son históricos. La verificación no es una réplica desde datos anatómicos ni revisión por otra instancia.')]
          REPORT_GZ = ''
          EXPECTED_REPORT = 'bacd2b2d62db267a7a8d8374772d3e6b97c8aad5b28b97aafeade94e2144ab87'
          RECEIPT = 'docs/agents/respuestas/2026-11-02-001-reuso-cierre-verificado-sin-relanzar.md'
          TARGET = "docs/agents/CONTEXTO-drosophila-fep.md"
          EXPECTED_CONTEXT = "9c24e919dcec1df4f009d0da91d7e63ea4c2bca0155b29ee24033ef910009413"
          TAIL = "## Madrugada y mañana del 13-oct (019 a 2026-10-14-061) · manda sobre el resto".encode()
          TAIL_HASH = "b6c9d0cf10d6dd0b4bb6f9abd6e39c4ac1891bf7c101f169cef4f38ca5b31fb5"
          ROOT = Path(os.environ.get("CONTEXTO_ROOT", "."))
          LOG = []
          def emit(s):
              LOG.append(s)
              print(s, flush=True)
          def require(ok, why):
              if not ok:
                  raise ValueError(why)
          def blob(b):
              return hashlib.sha1(("blob " + str(len(b)) + chr(0)).encode() + b).hexdigest()
          def transform(b):
              text = b.decode()
              for i, (prefix, replacement) in enumerate(TEXT_CHANGES, 1):
                  lines = text.splitlines(keepends=True)
                  positions = [j for j, line in enumerate(lines) if line.startswith(prefix)]
                  require(len(positions) == 1, "anchor_" + str(i) + ": expected 1, got " + str(len(positions)))
                  lines[positions[0]] = replacement + chr(10)
                  text = "".join(lines)
              return text.encode()
          def check_source(b):
              require(hashlib.sha256(b).hexdigest() == EXPECTED_CONTEXT, "source drift")
          original = (ROOT / TARGET).read_bytes()
          check_source(original)
          require(not (ROOT / RECEIPT).exists(), "receipt already exists")
          report = gzip.decompress(base64.b64decode(REPORT_GZ, validate=True))
          require(hashlib.sha256(report).hexdigest() == EXPECTED_REPORT, "response payload drift")
          fence = chr(96) * 3
          verifier = report.decode().split("## Apéndice A. Fuente exacta del verificador ejecutado", 1)[1].split(fence + "python" + chr(10), 1)[1].split(fence, 1)[0].encode()
          require(hashlib.sha256(verifier).hexdigest() == "0ce8261ae0cd2fa1b3731c98b7daa7c522413ef0a75dcb799033763b421d942e", "verifier embedded bytes changed")
          emit("source_blob=" + blob(original))
          emit("source_bytes=" + str(len(original)))
          emit("response_prefix_blob=" + blob(report))
          emit("response_prefix_bytes=" + str(len(report)))
          emit("verifier_embedded_bytes=" + str(len(verifier)))
          emit("verifier_embedded_pin=PASS")
          result = transform(original)
          emit("positive_transform=PASS")
          for i, (prefix, replacement) in enumerate(TEXT_CHANGES, 1):
              line = next(x for x in original.decode().splitlines(keepends=True) if x.startswith(prefix))
              emit("anchor_" + str(i) + "_count=1")
              variants = [("missing_anchor_", original.decode().replace(line, "", 1), "anchor_" + str(i) + ": expected 1, got 0"), ("duplicate_anchor_", original.decode() + line, "anchor_" + str(i) + ": expected 1, got 2")]
              for label, bad, why in variants:
                  try:
                      transform(bad.encode())
                  except ValueError as e:
                      require(str(e) == why, "wrong rejection: " + str(e))
                      emit(label + str(i) + "=REJECTED " + str(e))
                  else:
                      raise AssertionError("negative accepted")
          try:
              check_source(original + b"x")
          except ValueError as e:
              require(str(e) == "source drift", "wrong source rejection")
              emit("source_drift=REJECTED " + str(e))
          else:
              raise AssertionError("drift accepted")
          try:
              transform(result)
          except ValueError as e:
              require(str(e) == "anchor_4: expected 1, got 0", "wrong repeat rejection")
              emit("repeat_application=REJECTED " + str(e))
          else:
              raise AssertionError("repeat accepted")
          emit("negative_controls=12/12")
          require(original.count(TAIL) == result.count(TAIL) == 1, "tail anchor")
          old_tail = original[original.index(TAIL):]
          new_tail = result[result.index(TAIL):]
          require(old_tail == new_tail and len(old_tail) == 119028 and hashlib.sha256(old_tail).hexdigest() == TAIL_HASH, "historical tail changed")
          emit("historical_tail_bytes=" + str(len(old_tail)))
          emit("historical_tail_sha256=" + TAIL_HASH)
          emit("historical_tail_unchanged=True")
          reverse = result.decode()
          for prefix, replacement in reversed(TEXT_CHANGES):
              before = next(x for x in original.decode().splitlines(keepends=True) if x.startswith(prefix))
              require(reverse.count(replacement + chr(10)) == 1, "reverse anchor")
              reverse = reverse.replace(replacement + chr(10), before, 1)
          require(reverse.encode() == original, "reverse mismatch")
          emit("reverse_roundtrip=PASS")
          emit("result_blob=" + blob(result))
          emit("result_bytes=" + str(len(result)))
          emit("result_sha256=" + hashlib.sha256(result).hexdigest())
          mode = os.environ.get("CONTEXTO_MODE", "preflight")
          require(mode in ("preflight", "apply"), "unknown mode")
          if mode == "apply":
              (ROOT / TARGET).write_bytes(result)
              require((ROOT / TARGET).read_bytes() == result, "context readback")
              emit("target_readback_equal=True")
          else:
              (ROOT / "result-contexto.md").write_bytes(result)
          emit("response_prefix_preserved=True")
          doc = next(x[5:] for x in report.decode().splitlines() if x.startswith("Doc: "))
          appendix = chr(10) + "## Apéndice B. Cierre anclado del estado, sin relanzar ciencia" + chr(10) * 2
          appendix += "Cinco anclas, doce negativos rechazados, cola histórica intacta. El parche cambia sólo CONTEXTO y agrega este recibo. No modifica el productor ni su workflow, ni ejecuta nuevos nulos. La fuente del verificador queda íntegra como evidencia en el apéndice A." + chr(10) * 2
          if mode == "apply":
              instrument = "https://github.com/gatehot59-star/drosophila-fep-connectome/blob/" + os.environ["GITHUB_SHA"] + "/.github/workflows/contexto-topo-2026-11-01.yml"
              run = "https://github.com/gatehot59-star/drosophila-fep-connectome/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              appendix += "Instrumento documental: " + instrument + chr(10) * 2 + "Run documental (no científico): " + run + chr(10) * 2
          appendix += "Comando: Python embebido en el workflow, CONTEXTO_MODE=" + mode + ". Salida completa:" + chr(10) * 2 + fence + "text" + chr(10) + chr(10).join(LOG) + chr(10) + fence + chr(10) * 2
          appendix += "QA previo del mantenimiento: 57/60 = 95/100. Completitud 15/15: payload íntegro y sólo dos rutas; ejecutabilidad 14/15: programa y negativos probados, runner pendiente al puntuar; seguridad 14/15: mismo disparador y permiso, checkout fijado, pines y push sin force, sin auditoría exhaustiva de cadena de suministro; documentación 10/10: contrato, límites, código y salida cruda; proceso 4/5: instrumentos falsables, selección/interpretación no independientes. N/A 40 puntos de producto (testing de aplicación, arquitectura, DevOps e innovación): es mantenimiento documental, no producto. No es una probabilidad científica." + chr(10) * 2
          appendix += "--- METODO PROMETEO ---" + chr(10) + "Accion delicada: SI, mantenimiento del workflow documental existente, sin permisos nuevos." + chr(10) + "Modo aplicado: FULL." + chr(10) + "Maquina: brain-env para preflight; Actions x64 para publicar documentación." + chr(10) + "Rubrica previa: 57/60 = 95/100; N/A 40 puntos de producto." + chr(10) + "Review externo: no realizado." + chr(10) + "Instrumento: parche anclado, 12 negativos; evidencia cruda arriba. No se reejecuta H_REUSO_CIERRE." + chr(10) + "Artefactos: " + RECEIPT + " + " + doc + chr(10)
          final_report = report + appendix.encode()
          require(final_report.startswith(report), "report prefix changed")
          if mode == "apply":
              (ROOT / RECEIPT).write_bytes(final_report)
              require((ROOT / RECEIPT).read_bytes() == final_report, "receipt readback")
              message = "estado(reuso-cierre): publicar la verificacion terminada sin repetir el experimento" + chr(10) * 2 + "--- METODO PROMETEO ---" + chr(10) + "Accion delicada: SI, mantenimiento documental existente; sin permisos nuevos ni merge." + chr(10) + "Modo: FULL. Preflight 57/60 (95/100), N/A 40 puntos de producto." + chr(10) + "Maquina: Actions x64. Review externo: no realizado." + chr(10) + "Instrumento: cinco anclas, doce negativos, cola intacta; salida en el recibo." + chr(10) + "Artefactos: " + RECEIPT + " + " + doc + chr(10)
              Path("/tmp/reuso-cierre-doc-commit.txt").write_text(message)
          else:
              (ROOT / "result-receipt.md").write_bytes(final_report)
          PY
          git diff --check -- docs/agents/CONTEXTO-drosophila-fep.md
          git add -- docs/agents/CONTEXTO-drosophila-fep.md docs/agents/respuestas/2026-11-02-001-reuso-cierre-verificado-sin-relanzar.md
          python3 - <<'PY'
          import subprocess
          expected = {'docs/agents/CONTEXTO-drosophila-fep.md', 'docs/agents/respuestas/2026-11-02-001-reuso-cierre-verificado-sin-relanzar.md'}
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Unexpected staged paths: ' + repr(actual))
          print('STAGED_PATHS_OK', sorted(actual))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -F /tmp/reuso-cierre-doc-commit.txt
          git push origin HEAD:main
