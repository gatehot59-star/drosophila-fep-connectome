name: contexto-topo-2026-11-01

on:
  push:
    branches: ["titan/contexto-topo-2026-11-01"]
    paths: [".github/workflows/contexto-topo-2026-11-01.yml"]

permissions:
  contents: write

concurrency:
  group: contexto-topo-2026-11-01
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Leer main sin incorporar la rama del instrumento
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Verificar anclas, probar rechazos y escribir solo documentacion
        shell: bash
        env:
          CONTEXTO_MODE: apply
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, textwrap, urllib.request
          from pathlib import Path
          url = "https://raw.githubusercontent.com/gatehot59-star/drosophila-fep-connectome/e79ff3b29e60719c149501cea3468fae95e83e0d/.github/workflows/contexto-topo-2026-11-01.yml"
          raw = urllib.request.urlopen(url, timeout=30).read()
          assert hashlib.sha256(raw).hexdigest() == "f17761a80f19fdc95c3db0898d86978bf727c321858a81e2383e3de54f0ba5ae", "immutable recovery source changed"
          text = raw.decode()
          repairs = [("VvKxZZGefw", "VvKxZGefw"), ("In1Me9bSPd", "In1Me9SPd"), ("c3L++1kVOU2mhs", "c3L++1kVo2mhs")]
          for old, new in repairs:
              assert text.count(old) == 1, "recovery anchor not unique"
              text = text.replace(old, new, 1)
          assert hashlib.sha256(text.encode()).hexdigest() == "90d9f86180bcfbb332065677c2a0b78a37ba2c7c7ee901bd9c3539c16611b157", "recovery differs from tested workflow"
          start = "          python3 - <<'PY'" + chr(10)
          stop = "          PY" + chr(10)
          assert text.count(start) == 2 and text.count(stop) == 2, "unexpected script population"
          program = textwrap.dedent(text.split(start, 1)[1].split(stop, 1)[0])
          namespace = {"__name__": "__main__"}
          exec(compile(program, url, "exec"), namespace)
          root, mode = namespace["ROOT"], namespace["mode"]
          receipt = root / (namespace["RECEIPT"] if mode == "apply" else "result-receipt.md")
          note = chr(10) + "### Incidencias documentales, sin efecto científico" + chr(10) * 2
          note += "El primer lanzador del preflight omitió importar sys; se corrigió antes de probar. Después, el primer push del workflow incorporó tres errores de transcripción en el bloque comprimido: 30.218 bytes publicados frente a 30.215 probados. El run documental 41391345653 falló antes de escribir: main siguió en d866c2da6de71f404738b059a18014599a9d5c4a. No se alteró el recibo científico ni se relanzó su ejecución." + chr(10) * 2
          note += "La recuperación lee aquel commit inmutable, exige su SHA256, repara exactamente las tres diferencias y exige el SHA256 90d9f86180bcfbb332065677c2a0b78a37ba2c7c7ee901bd9c3539c16611b157 del workflow que pasó el preflight. Sólo entonces ejecuta su bloque documental, que a su vez exige las huellas del recibo, del verificador y del CONTEXTO. No se debilita ninguna guarda. Se preservan el prefijo de la respuesta y la historia del contexto." + chr(10)
          with receipt.open("ab") as out:
              out.write(note.encode())
          assert receipt.read_bytes().startswith(namespace["report"]), "prefix changed by incident note"
          print("TRANSPORT_RECOVERY_EXACT=PASS")
          PY
          git diff --check -- docs/agents/CONTEXTO-drosophila-fep.md
          git add -- docs/agents/CONTEXTO-drosophila-fep.md docs/agents/respuestas/2026-11-02-001-reuso-cierre-verificado-sin-relanzar.md
          python3 - <<'PY'
          import subprocess
          expected = {'docs/agents/CONTEXTO-drosophila-fep.md', 'docs/agents/respuestas/2026-11-02-001-reuso-cierre-verificado-sin-relanzar.md'}
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Unexpected staged paths: ' + repr(actual))
          print('STAGED_PATHS_OK', sorted(actual))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -F /tmp/reuso-cierre-doc-commit.txt
          git push origin HEAD:main
