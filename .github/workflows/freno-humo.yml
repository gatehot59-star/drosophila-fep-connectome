name: freno-humo
# Respuesta 2026-10-14-023. Humo de H_FRENO en Actions x64 con objetivo DNp01 (DNp06 queda ciega): verifica que el
# instrumento corre igual fuera de brain-env. Se dispara al pushear results/frena_giro_2026-10-14_humo/HUMO.
on:
  push:
    branches: ["titan/frena-giro-2026-10-14"]
    paths: ["results/frena_giro_2026-10-14_humo/HUMO"]
permissions:
  contents: write
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 pyarrow==25.0.1
  CONN_URL: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Connectivity_783.parquet
  ANNOT_URL: https://raw.githubusercontent.com/flyconnectome/flywire_annotations/17fc57722002e1a7d38cdd0c89ac382bf92718da/supplemental_files/Supplemental_file1_neuron_annotations.tsv
jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: prueba, humo y commit
        shell: bash
        run: |
          set -o pipefail
          python -m pip install $DEPS
          mkdir -p /tmp/in
          D=results/frena_giro_2026-10-14_humo
          mkdir -p "$D"
          python tools/frena_giro/prueba_freno.py 2>&1 | tee "$D/prueba_actions.log" || echo "prueba_exit=$?" >> "$D/prueba_actions.log"
          curl -fsSL -o /tmp/in/connectivity.parquet "$CONN_URL"
          curl -fsSL -o /tmp/in/annotations.tsv "$ANNOT_URL"
          md5sum /tmp/in/connectivity.parquet /tmp/in/annotations.tsv > "$D/versiones.txt"
          python tools/frena_giro/freno_mosca.py --conn /tmp/in/connectivity.parquet --annot /tmp/in/annotations.tsv --out "$D" --humo 2>&1 | tee "$D/humo_actions.log" || echo "humo_exit=$?" >> "$D/humo_actions.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -m "humo(2026-10-14-023): H_FRENO en Actions x64 con DNp01, numeros sin valor" || echo nada_que_commitear
          git pull --rebase origin titan/frena-giro-2026-10-14 || true
          git push origin HEAD:titan/frena-giro-2026-10-14
