# CI minimo - A-03 de la auditoria externa.
#
# Este workflow corre guards de evidencia, no mediciones cientificas pesadas.
# La suite exige que los instrumentos puedan dar rojo y que el arbol termine limpio.

name: guards

on:
  push:
    branches:
      - main
      - 'titan/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: bateria de guards (debe poder dar rojo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python del runner
        run: |
          python3 --version
          python3 -c "import sys; print('ejecutable', sys.executable)"

      - name: bateria stdlib de guards
        run: |
          python3 -S src/test_guards_negativo.py

      - name: mutar guards.py a proposito
        run: python3 -S src/ci_mutate_guards.py mutate

      - name: la bateria DEBE dar rojo sobre el archivo mutado
        run: |
          if python3 -S src/test_guards_negativo.py > /tmp/mutado.log 2>&1; then
            echo "GUARD_FAILED la bateria dio VERDE sobre un guards.py roto a proposito"
            tail -20 /tmp/mutado.log
            exit 1
          fi
          echo "OK la bateria detecto la mutacion y dio rojo"
          grep '^FAIL' /tmp/mutado.log || true

      - name: restaurar guards.py
        run: python3 -S src/ci_mutate_guards.py restore

      - name: la bateria vuelve a dar verde
        run: python3 -S src/test_guards_negativo.py

      - name: H4 alignment guard, positivos y negativos
        run: python3 -S tests/test_h4_alignment_guard.py

      - name: el arbol de trabajo quedo limpio
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "GUARD_FAILED el job dejo el arbol sucio:"
            git status --porcelain
            exit 1
          fi
          echo "OK el arbol quedo identico al checkout"
