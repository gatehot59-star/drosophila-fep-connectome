# CI minimo - A-03 de la auditoria externa.
#
# Por que existe: la auditoria midio que este repo no tiene entorno reproducible
# (sin pins, sin lockfile, sin CI), y que sus guards imprimian rojo y salian con
# exit 0. La bateria de src/test_guards_negativo.py existe y corre a mano; sin CI,
# nada la ejecuta, y un test que nadie corre es documentacion.
#
# ------------------------------------------------------------------------------
# HISTORIA DE ESTE ARCHIVO, porque sus dos primeras versiones dieron ROJO
# ------------------------------------------------------------------------------
# v1: embebia la mutacion con `python - <<'EOF'` indentado dentro de un bloque
#     `run:`. Bash pasa las lineas al stdin de python CON la indentacion del YAML,
#     asi que python abortaba con IndentationError antes de leer una linea util.
#     El CI fallo por un bug del PASO, no por lo que el paso mide.
#     Arreglo: la mutacion vive en src/ci_mutate_guards.py, un archivo con nombre.
#
# v2: los cuatro pins de requirements.txt estaban puestos de memoria y uno
#     (pandas 2.3.4) no existe en PyPI, asi que pip abortaba. Arreglo: los pins
#     salen de correr el interprete y se verificaron contra PyPI.
#     Y un segundo bug del mismo YAML: el paso 3 escribia mutado.log en el arbol y
#     el paso 6 exigia arbol limpio, asi que el 6 iba a fallar SIEMPRE por el
#     archivo que el 3 crea. Un guard que no puede dar verde es tan inutil como
#     uno que no puede dar rojo. El log se movio a /tmp.
#
# Las dos veces la causa fue mia y las dos veces la encontro el CI. Eso es B-01
# funcionando: cuando existe medicion externa, gana la externa.
# ------------------------------------------------------------------------------
#
# Lo que este workflow hace, y nada mas:
#   1. instala dependencias PINNEADAS e IMPRIME las versiones medidas;
#   2. corre la bateria de guards y exige verde;
#   3. MUTA guards.py a proposito y exige ROJO, porque un test que no puede
#      fallar no mide nada;
#   4. restaura y exige verde otra vez;
#   5. comprueba que el job no dejo el arbol sucio.
# Sin continue-on-error y sin `|| true`, que es el antipatron que A-01 denuncia.
#
# Lo que este workflow NO hace, declarado: no corre ninguna medicion cientifica.
# El conectoma no esta en el repo (100 MB de parquet), asi que ningun job de CI
# puede reproducir un null. Eso queda como limitacion, no como promesa.

name: guards

on:
  push:
    branches:
      - main
      - 'titan/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: bateria de guards (debe poder dar rojo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: dependencias con pins exactos
        run: pip install -r requirements.txt

      - name: versiones medidas, no supuestas
        run: python -c "import sys, numpy, scipy, pandas, pyarrow; print('python ', sys.version.split()[0]); print('numpy  ', numpy.__version__); print('scipy  ', scipy.__version__); print('pandas ', pandas.__version__); print('pyarrow', pyarrow.__version__)"

      - name: 1 - bateria de guards con el archivo intacto (exige VERDE)
        run: python src/test_guards_negativo.py

      - name: 2 - mutar guards.py a proposito
        run: python src/ci_mutate_guards.py mutate

      - name: 3 - la bateria DEBE dar rojo sobre el archivo mutado
        run: |
          if python src/test_guards_negativo.py > /tmp/mutado.log 2>&1; then
            echo "GUARD_FAILED la bateria dio VERDE sobre un guards.py roto a proposito"
            tail -20 /tmp/mutado.log
            exit 1
          fi
          echo "OK la bateria detecto la mutacion y dio rojo"
          grep '^FAIL' /tmp/mutado.log || true

      - name: 4 - restaurar guards.py
        run: python src/ci_mutate_guards.py restore

      - name: 5 - la bateria vuelve a dar verde con el archivo restaurado
        run: python src/test_guards_negativo.py

      - name: 6 - el arbol de trabajo quedo limpio
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "GUARD_FAILED el job dejo el arbol sucio:"
            git status --porcelain
            exit 1
          fi
          echo "OK el arbol quedo identico al checkout"
