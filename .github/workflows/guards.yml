# CI minimo - A-03 de la auditoria externa.
#
# Por que existe: la auditoria midio que este repo no tiene entorno reproducible
# (sin pins, sin lockfile, sin CI), y que sus guards imprimian rojo y salian con
# exit 0. La bateria de src/test_guards_negativo.py existe y corre a mano; sin CI,
# nada la ejecuta, y un test que nadie corre es documentacion.
#
# Lo que este workflow hace, y nada mas: instala las dependencias PINNEADAS y
# corre la bateria de guards. Si la bateria devuelve distinto de cero, el job es
# rojo. No hay continue-on-error y no hay || true, que es exactamente el
# antipatron que A-01 denuncia.
#
# Lo que este workflow NO hace, declarado: no corre ninguna medicion cientifica.
# El conectoma no esta en el repo (100 MB de parquet), asi que ningun job de CI
# puede reproducir un null. Eso queda como limitacion, no como promesa.

name: guards

on:
  push:
    branches:
      - main
      - 'titan/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: bateria de guards (debe poder dar rojo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python pinneado
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: dependencias con pins exactos
        run: |
          python -m pip install --upgrade pip==25.2
          pip install -r requirements.txt

      - name: versiones medidas, no supuestas
        run: |
          python -c "import sys, numpy, scipy, pandas, pyarrow; print('python ', sys.version.split()[0]); print('numpy  ', numpy.__version__); print('scipy  ', scipy.__version__); print('pandas ', pandas.__version__); print('pyarrow', pyarrow.__version__)"

      - name: bateria de guards
        run: python src/test_guards_negativo.py

      - name: prueba de MUTACION - la bateria tiene que poder dar rojo
        run: |
          cp src/guards.py /tmp/guards_good.py
          python - <<'EOF'
          path = "src/guards.py"
          old = "        if abs(mu - r) <= float(atol):"
          new = "        if True:  # MUTACION DE CI: comportamiento viejo de A-02"
          src = open(path).read()
          assert old in src, "ANCLA_NO_ENCONTRADA: la mutacion de CI quedo obsoleta"
          open(path, "w").write(src.replace(old, new, 1))
          print("MUTACION_APLICADA")
          EOF
          set +e
          python src/test_guards_negativo.py > /tmp/mutado.log 2>&1
          rc=$?
          set -e
          cp /tmp/guards_good.py src/guards.py
          echo "returncode con guards.py MUTADO = $rc"
          tail -5 /tmp/mutado.log
          if [ "$rc" -eq 0 ]; then
            echo "GUARD_FAILED la bateria dio verde sobre un guards.py roto a proposito"
            exit 1
          fi
          echo "OK la bateria detecto la mutacion y dio rojo"

      - name: la bateria vuelve a dar verde con el archivo restaurado
        run: python src/test_guards_negativo.py
