name: H4 temporal halves

on:
  push:
    branches:
      - 'titan/**'
    paths:
      - 'tools/h4_temporal_halves.py'
      - 'tests/test_h4_temporal_halves.py'
      - 'tools/h4_block_null.py'
      - '.github/workflows/h4-temporal-halves.yml'
  pull_request:
    paths:
      - 'tools/h4_temporal_halves.py'
      - 'tests/test_h4_temporal_halves.py'
      - 'tools/h4_block_null.py'
      - '.github/workflows/h4-temporal-halves.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: temporal-half contracts
        run: python3 -S tests/test_h4_temporal_halves.py
