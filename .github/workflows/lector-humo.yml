name: lector-humo
# Respuesta 2026-10-14-037. Humo ciego de H_LECTOR (tools/lector/SELLO-LECTOR.md, 8e65e05): controles a tamano completo
# en las 6 celdas (REPRO_W, REPRO_RIDGE, CONTROL_NEGATIVO y, en c0, CONTROL_LECTOR_CRUDO), rutas de un nulo SL y uno T
# con 600 y 200 ensayos en la semilla 99, y la prueba del instrumento. No imprime aciertos de L.
# Solo se dispara al pushear results/lector_2026-10-15_humo/HUMO en esta rama.
on:
  push:
    branches: ["titan/lector-2026-10-15"]
    paths: ["results/lector_2026-10-15_humo/HUMO"]
  workflow_dispatch:
permissions:
  contents: write
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==25.0.1
  CONN_URL: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Connectivity_783.parquet
  ANNOT_URL: https://raw.githubusercontent.com/flyconnectome/flywire_annotations/17fc57722002e1a7d38cdd0c89ac382bf92718da/supplemental_files/Supplemental_file1_neuron_annotations.tsv
jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {parte: c0, args: "--celda '0.0|0.15' --humo"}
          - {parte: c1, args: "--celda '0.0|0.45' --humo"}
          - {parte: c2, args: "--celda '0.3|0.15' --humo"}
          - {parte: c3, args: "--celda '0.3|0.45' --humo"}
          - {parte: c4, args: "--celda '0.6|0.15' --humo"}
          - {parte: c5, args: "--celda '0.6|0.45' --humo"}
          - {parte: nulo_SL, args: "--celda '0.3|0.15' --nulos SL --k0 0 --n 1 --real --humo"}
          - {parte: nulo_T, args: "--celda '0.6|0.45' --nulos T --k0 0 --n 1 --humo"}
          - {parte: prueba, args: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: humo
        shell: bash
        run: |
          set -o pipefail
          python -m pip install $DEPS
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          mkdir -p /tmp/in out
          python -m pip freeze > out/versiones_humo_${{ matrix.parte }}.txt
          if [ "${{ matrix.parte }}" = "prueba" ]; then
            python tools/lector/prueba_lector.py 2>&1 | tee out/humo_prueba.log
            exit $?
          fi
          curl -fsSL -o /tmp/in/connectivity.parquet "$CONN_URL"
          curl -fsSL -o /tmp/in/annotations.tsv "$ANNOT_URL"
          md5sum /tmp/in/connectivity.parquet /tmp/in/annotations.tsv >> out/versiones_humo_${{ matrix.parte }}.txt
          python tools/lector/lector_mosca.py --conn /tmp/in/connectivity.parquet --annot /tmp/in/annotations.tsv --out out ${{ matrix.args }} 2>&1 | tee out/humo_${{ matrix.parte }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lector-humo-${{ matrix.parte }}
          path: out/
  commitear:
    needs: [humo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lector-humo-*
          path: art
      - name: commitear el humo
        shell: bash
        run: |
          D=results/lector_2026-10-15_humo/actions
          mkdir -p "$D"
          cp art/*/*.log art/*/*.txt art/*/*.json "$D"/ 2>/dev/null || true
          (cd "$D" && md5sum *.log *.txt *.json > MD5SUMS.txt || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -m "humo(2026-10-14-037): H_LECTOR en Actions x64, controles a tamano completo y rutas ciegas" || echo nada_que_commitear
          git pull --rebase origin titan/lector-2026-10-15 || true
          git push origin HEAD:titan/lector-2026-10-15
