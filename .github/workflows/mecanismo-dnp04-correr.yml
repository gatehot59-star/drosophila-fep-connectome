name: mecanismo-dnp04-correr
# Respuesta 2026-11-02-006. Corrida sellada de H_MECANISMO_DNp04 (tools/mecanismo/dnp04/SELLO-DNP04-2026-11-02.md).
# Cada trabajo exige las huellas de HUELLAS.sha256 y se niega a repetir si ya hay resultados. Ocho celdas: cuatro
# estimulos derechos partidos en _a (C0, C1, Q1, Q2) y _b (C0, Q3, Q4, Q5, Q6). Solo se dispara al pushear
# results/mecanismo_dnp04_2026-11-02/CORRER.
on:
  push:
    branches: ["titan/mecanismo-dnp04-2026-11-02"]
    paths: ["results/mecanismo_dnp04_2026-11-02/CORRER"]
permissions:
  contents: write
concurrency:
  group: mecanismo-dnp04-correr
  cancel-in-progress: false
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==25.0.1
  LIFDEPS: brian2==2.10.1 cython==3.1.3 joblib==1.6.0
  SHIU: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        celda: [q_LC4_right_a, q_LC4_right_b, q_LPLC2_right_a, q_LPLC2_right_b, q_LPLC1_right_a, q_LPLC1_right_b, q_LPLC4_right_a, q_LPLC4_right_b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: medir ${{ matrix.celda }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          exec > >(tee out/medir_${{ matrix.celda }}.log) 2>&1
          printf 'UTC_START '; date -u --iso-8601=seconds
          printf 'SOURCE_COMMIT '; git rev-parse HEAD
          if [ -e results/mecanismo_dnp04_2026-11-02/actions_correr ]; then echo 'REFUSE: ya hay resultados; no se repite la medicion'; exit 4; fi
          sha256sum --check tools/mecanismo/dnp04/HUELLAS.sha256
          python -m pip install $DEPS $LIFDEPS
          mkdir -p /tmp/shiu /tmp/in
          curl -fsSL --retry 2 --max-time 300 -o /tmp/in/connectivity.parquet "$SHIU/Connectivity_783.parquet"
          curl -fsSL --retry 2 --max-time 300 -o /tmp/in/completeness.csv "$SHIU/Completeness_783.csv"
          curl -fsSL --retry 2 --max-time 300 -o /tmp/shiu/model.py "$SHIU/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  /tmp/shiu/model.py' | sha256sum --check -
          printf '%s\n' '3d802fd542b5d18570ba1ba0bb0abed9  /tmp/in/connectivity.parquet' '031a4b6eac490bda17c75b65ccaa7906  /tmp/in/completeness.csv' | md5sum --check -
          python -m pip freeze > out/versiones_${{ matrix.celda }}.txt
          { nproc; free -m; } >> out/versiones_${{ matrix.celda }}.txt
          if [ -x /usr/bin/time ]; then TV="/usr/bin/time -v"; else TV=""; fi
          $TV python tools/mecanismo/dnp04/intervenir_dnp04.py --shiu /tmp/shiu --conn /tmp/in/connectivity.parquet --comp /tmp/in/completeness.csv --conjuntos results/mecanismo_2026-11-02/actions_correr2/conjuntos_flywire.json --celda ${{ matrix.celda }} --out out --n-proc 3
          printf 'UTC_END '; date -u --iso-8601=seconds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mecanismo-dnp04-${{ matrix.celda }}
          path: out/
  agregar:
    needs: [medir]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: mecanismo-dnp04-*
          path: art
      - name: agregar con las reglas del sello y conservar todo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install $DEPS
          D=results/mecanismo_dnp04_2026-11-02/actions_correr
          mkdir -p "$D"
          find art -type f \( -name '*.json' -o -name '*.log' -o -name '*.txt' \) -exec cp {} "$D"/ \;
          set +e
          python tools/mecanismo/dnp04/agregar_dnp04.py --dir "$D" --previa results/mecanismo_2026-11-02/actions_correr2 > "$D"/agregar_stdout.log 2>&1
          RC=$?
          set -e
          cat "$D"/agregar_stdout.log
          echo "EXIT_AGREGAR=$RC" >> "$D"/agregar_stdout.log
          printf 'medir=%s fuente=%s run=%s\n' "${{ needs.medir.result }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$D"/RESULTADO.txt
          (cd "$D" && md5sum * > MD5SUMS.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -m "medicion(2026-11-02-006): corrida sellada de H_MECANISMO_DNp04, run $GITHUB_RUN_ID"
          git pull --rebase origin titan/mecanismo-dnp04-2026-11-02
          git push origin HEAD:titan/mecanismo-dnp04-2026-11-02
