name: mecanismo-dnp04-prueba
# Respuesta 2026-11-02-006. Pruebas del instrumento de H_MECANISMO_DNp04 antes de correrlo: mascaras, estadistica,
# agregador con veredictos plantados, filas reales y un humo que no mira ninguna condicion de la hipotesis.
# Solo se dispara al pushear tools/mecanismo/dnp04/PROBAR.
on:
  push:
    branches: ["titan/mecanismo-dnp04-2026-11-02"]
    paths: ["tools/mecanismo/dnp04/PROBAR"]
permissions:
  contents: write
concurrency:
  group: mecanismo-dnp04-prueba
  cancel-in-progress: false
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==25.0.1
  LIFDEPS: brian2==2.10.1 cython==3.1.3 joblib==1.6.0
  SHIU: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: pruebas y humo
        shell: bash
        run: |
          set -euo pipefail
          D=results/mecanismo_dnp04_2026-11-02/prueba
          mkdir -p "$D"
          exec > >(tee "$D"/prueba.log) 2>&1
          printf 'UTC_START '; date -u --iso-8601=seconds
          printf 'SOURCE_COMMIT '; git rev-parse HEAD
          sha256sum --check tools/mecanismo/dnp04/HUELLAS.sha256
          python -m pip install $DEPS $LIFDEPS
          mkdir -p /tmp/shiu /tmp/in
          curl -fsSL --retry 2 --max-time 300 -o /tmp/in/connectivity.parquet "$SHIU/Connectivity_783.parquet"
          curl -fsSL --retry 2 --max-time 300 -o /tmp/in/completeness.csv "$SHIU/Completeness_783.csv"
          curl -fsSL --retry 2 --max-time 300 -o /tmp/shiu/model.py "$SHIU/model.py"
          echo 'fc45837d7122c6ce2a7f3f2f23c515992e4b232aadb919efabb72337fac88e4e  /tmp/shiu/model.py' | sha256sum --check -
          printf '%s\n' '3d802fd542b5d18570ba1ba0bb0abed9  /tmp/in/connectivity.parquet' '031a4b6eac490bda17c75b65ccaa7906  /tmp/in/completeness.csv' | md5sum --check -
          python -m pip freeze > "$D"/versiones.txt
          { nproc; free -m; } >> "$D"/versiones.txt
          python tools/mecanismo/dnp04/prueba_dnp04.py --conn /tmp/in/connectivity.parquet --comp /tmp/in/completeness.csv --conjuntos results/mecanismo_2026-11-02/actions_correr2/conjuntos_flywire.json --previa results/mecanismo_2026-11-02/actions_correr2 --shiu /tmp/shiu --humo "$D"/humo
          printf 'UTC_END '; date -u --iso-8601=seconds
      - name: conservar la prueba en la rama
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          D=results/mecanismo_dnp04_2026-11-02/prueba
          mkdir -p "$D"
          printf 'prueba=%s fuente=%s run=%s\n' "${{ job.status }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$D"/RESULTADO.txt
          (cd "$D" && find . -type f ! -name MD5SUMS.txt | sort | xargs md5sum > MD5SUMS.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/mecanismo_dnp04_2026-11-02
          git commit -m "medicion(2026-11-02-006): prueba de H_MECANISMO_DNp04, run $GITHUB_RUN_ID"
          git pull --rebase origin titan/mecanismo-dnp04-2026-11-02
          git push origin HEAD:titan/mecanismo-dnp04-2026-11-02
