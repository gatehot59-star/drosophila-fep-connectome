name: nucleo-humo
# Respuesta 2026-10-14-002. Humo del nucleo antes del sello: construir a tamano real (NUCLEO_tamano tiene que dar True
# con la huella sellada), grilla y nulos SL y T cortos con todo el camino, y la prueba del agregador. Solo se dispara
# al pushear results/nucleo_2026-10-14_humo/HUMO en esta rama. El parquet del nucleo no se commitea.
on:
  push:
    branches: ["titan/htau-nucleo-banc-2026-10-14"]
    paths: ["results/nucleo_2026-10-14_humo/HUMO"]
  workflow_dispatch:
permissions:
  contents: write
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==25.0.1
  CONN_URL: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Connectivity_783.parquet
  ANNOT_URL: https://raw.githubusercontent.com/flyconnectome/flywire_annotations/17fc57722002e1a7d38cdd0c89ac382bf92718da/supplemental_files/Supplemental_file1_neuron_annotations.tsv
jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        parte: [construir, grilla, nulos_SL, nulos_T, agregador]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: humo
        shell: bash
        run: |
          set -o pipefail
          python -m pip install $DEPS
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          mkdir -p /tmp/in out
          P="${{ matrix.parte }}"
          if [ "$P" = "agregador" ]; then
            python tools/nucleo/prueba_agregar_nucleo.py 2>&1 | tee out/nucleo_humo_agregador.log
            exit 0
          fi
          curl -fsSL -o /tmp/in/connectivity.parquet "$CONN_URL"
          curl -fsSL -o /tmp/in/annotations.tsv "$ANNOT_URL"
          md5sum /tmp/in/connectivity.parquet /tmp/in/annotations.tsv > out/versiones_nucleo_$P.txt
          C="--conn /tmp/in/connectivity.parquet --annot /tmp/in/annotations.tsv --out out"
          if [ "$P" = "construir" ]; then
            python tools/nucleo/nucleo_mosca.py $C --modo construir 2>&1 | tee out/nucleo_humo_construir.log
            rm -f out/*.parquet
          elif [ "$P" = "grilla" ]; then
            python tools/nucleo/nucleo_mosca.py $C --modo grilla --taus 0 --pruebas 2 --celdas "0.3|0.15" --etiqueta humo --humo 2>&1 | tee out/nucleo_humo_grilla.log
          elif [ "$P" = "nulos_SL" ]; then
            python tools/nucleo/nucleo_mosca.py $C --modo nulos --tipo SL --k0 0 --n 1 --real --humo 2>&1 | tee out/nucleo_humo_nulos_SL.log
          else
            python tools/nucleo/nucleo_mosca.py $C --modo nulos --tipo T --k0 0 --n 1 --real --humo 2>&1 | tee out/nucleo_humo_nulos_T.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nucleo-humo-${{ matrix.parte }}
          path: out/
  commitear:
    needs: [humo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nucleo-humo-*
          path: art
          merge-multiple: true
      - name: commitear el humo
        shell: bash
        run: |
          D=results/nucleo_2026-10-14_humo
          mkdir -p "$D"
          find art -type f \( -name "*.log" -o -name "*.txt" -o -name "*.json" \) -exec cp {} "$D"/ \;
          (cd "$D" && md5sum *.log *.txt *.json > MD5SUMS.txt || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -m "humo(2026-10-14-002): nucleo en Actions, construir a tamano real, grilla y nulos cortos, prueba del agregador" || echo nada_que_commitear
          git pull --rebase origin titan/htau-nucleo-banc-2026-10-14 || true
          git push origin HEAD:titan/htau-nucleo-banc-2026-10-14
