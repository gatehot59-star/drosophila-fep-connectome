name: paper3-fuentes-2026-10-14-043
# Respuesta 2026-10-14-043: trae verbatim las fuentes 065, 066 y 067 (rama titan/materializacion-h4-guard-2026-10-02) y 038 (main), aplica el parche del esqueleto del Paper 3, corre el cotejo y su control, y se borra en el mismo commit.
on:
  push:
    branches: ["titan/paper3-esqueleto-2026-10-14"]
    paths: ["tools/paper3/editar_esqueleto_2026-10-14-043.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fuentes, parche, cotejo y borrar este workflow
        shell: bash
        run: |
          set -euo pipefail
          R=docs/agents/respuestas
          H=origin/titan/materializacion-h4-guard-2026-10-02
          git fetch -q origin titan/materializacion-h4-guard-2026-10-02 main
          for f in 2026-08-25-065-el-LC6-GF-sobrevive-el-null-anatomico-y-aparece-una-tabla-de-ruteo.md 2026-08-25-066-barrido-de-literatura-la-tabla-de-ruteo-YA-esta-publicada.md 2026-08-25-067-el-Cell-Type-Explorer-de-FAFB-publica-la-tabla-entera.md; do
            git show "$H:$R/$f" > "$R/$f"
          done
          git show "origin/main:$R/2026-10-14-038-h-lector-medido.md" > "$R/2026-10-14-038-h-lector-medido.md"
          printf '%s\n' \
            "53a81e9dbc23469499ccd55295cf3986  $R/2026-08-25-065-el-LC6-GF-sobrevive-el-null-anatomico-y-aparece-una-tabla-de-ruteo.md" \
            "f1a0f562379c74b5663d7d2b874190ae  $R/2026-08-25-066-barrido-de-literatura-la-tabla-de-ruteo-YA-esta-publicada.md" \
            "09b5a5ad67a6454d0682c8a26638800b  $R/2026-08-25-067-el-Cell-Type-Explorer-de-FAFB-publica-la-tabla-entera.md" \
            "db387286da41865d99d011d3d94f50ce  $R/2026-10-14-038-h-lector-medido.md" | md5sum -c -
          python3 tools/paper3/editar_esqueleto_2026-10-14-043.py
          echo "a904026e345d0284b8e0196d6eb767fb  docs/paper3/paper3-esqueleto.md" | md5sum -c -
          D=results/paper3_2026-10-15
          mkdir -p "$D"
          python3 tools/paper3/cotejar_paper3.py docs/paper3/paper3-esqueleto.md "$R" | tee "$D/cotejo.log"
          python3 tools/paper3/cotejar_paper3.py docs/paper3/paper3-esqueleto.md "$R" --control | tee "$D/control.log"
          md5sum docs/paper3/paper3-esqueleto.md "$R"/2026-08-25-06[567]-*.md "$R"/2026-10-14-038-*.md "$D/cotejo.log" "$D/control.log" > "$D/MD5SUMS"
          cat "$D/MD5SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/paper3-fuentes-2026-10-14-043.yml
          git add docs results
          git commit -m "docs(2026-10-14-043): esqueleto del Paper 3 con los dos nulos de LC6 a GF, el prior art y el vinculo con H_LECTOR, cotejado y aplicado en Actions"
          git push origin HEAD:titan/paper3-esqueleto-2026-10-14
