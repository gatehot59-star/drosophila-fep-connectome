name: paper3-fuentes-2026-10-14-044
# Respuesta 2026-10-14-044: trae verbatim la respuesta 044 desde main, aplica el parche del §1 del esqueleto del Paper 3, corre el cotejo y su control, y se borra en el mismo commit.
on:
  push:
    branches: ["titan/paper3-esqueleto-2026-10-14"]
    paths: ["tools/paper3/editar_esqueleto_2026-10-14-044.py"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fuente, parche, cotejo y borrar este workflow
        shell: bash
        run: |
          set -euo pipefail
          R=docs/agents/respuestas
          F=2026-10-14-044-paper3-la-pregunta-ya-esta-respondida-por-banc.md
          git fetch -q origin main
          git show "origin/main:$R/$F" > "$R/$F"
          echo "a848c30cf25cf7efb4d970ad07090fd8  $R/$F" | md5sum -c -
          python3 tools/paper3/editar_esqueleto_2026-10-14-044.py
          echo "dd9aa7c30bc9046f3d5d0ff5d354d344  docs/paper3/paper3-esqueleto.md" | md5sum -c -
          D=results/paper3_2026-10-15
          python3 tools/paper3/cotejar_paper3.py docs/paper3/paper3-esqueleto.md "$R" | tee "$D/cotejo_044.log"
          python3 tools/paper3/cotejar_paper3.py docs/paper3/paper3-esqueleto.md "$R" --control | tee "$D/control_044.log"
          md5sum docs/paper3/paper3-esqueleto.md "$R/$F" "$D/cotejo_044.log" "$D/control_044.log" > "$D/MD5SUMS_044"
          cat "$D/MD5SUMS_044"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/paper3-fuentes-2026-10-14-044.yml
          git add docs results
          git commit -m "docs(2026-10-14-044): §1 del Paper 3 con el prior art de BANC, Braun y Sturner, cotejado y aplicado en Actions"
          git push origin HEAD:titan/paper3-esqueleto-2026-10-14
