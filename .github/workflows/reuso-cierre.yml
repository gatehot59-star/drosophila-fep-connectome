name: reuso-cierre-2026-11-01
on:
  push:
    branches: ["titan/reuso-cierre-2026-11-01"]
    paths:
      - "tools/reuso/reuso_cierre.py"
      - ".github/workflows/reuso-cierre.yml"
permissions:
  contents: write
concurrency:
  group: reuso-cierre-2026-11-01
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  reuso-cierre:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Pruebas, mutacion, humo y full con el sello previo
        shell: bash
        run: |
          set -euo pipefail
          D=results/reuso_cierre_2026-11-01
          if [ -e "$D/cierre.json" ]; then
            echo 'REFUSE: cierre.json already exists; no automatic scientific rerun'
            exit 4
          fi
          mkdir -p "$D" /tmp/reuso-input
          exec > >(tee "$D/run-$GITHUB_RUN_ID.log") 2>&1
          printf 'UTC_START '; date -u --iso-8601=seconds
          printf 'SOURCE_COMMIT '; git rev-parse HEAD
          printf '%s  %s\n' 'db27c17b31e5bceb4a237f1e86ccfb30a57b19ad3a6e9a70e4a25232faf56783' 'tools/reuso/reuso_cierre.py' | sha256sum --check -
          python -m pip install numpy==2.5.3 pandas==3.0.5 pyarrow==25.0.1 scipy==1.18.1
          python - <<'PY'
          import importlib.util, pathlib, shutil, subprocess, sys, tempfile
          root = pathlib.Path('tools/reuso').resolve()
          source = (root / 'reuso_cierre.py').read_text()
          old = 'sign = d["inh"][post].astype(np.int64)  # closure-sign-key'
          assert source.count(old) == 1
          q = pathlib.Path(tempfile.mkdtemp(prefix='cierre-mutant-'))
          for name in ['reuso_mosca.py', 'prueba_reuso.py', 'reuso_estricto.py', 'SELLO-CIERRE-2026-11-01.md']:
              shutil.copyfile(root / name, q / name)
          (q / 'reuso_cierre.py').write_text(source.replace(old, 'sign = np.zeros(len(post), dtype=np.int64)  # closure-sign-key'))
          command = [sys.executable, str(q / 'reuso_cierre.py'), '--mode', 'selftest']
          print('MUTATION_COMMAND', command, flush=True)
          broken = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=600)
          print(broken.stdout, end='', flush=True)
          print('MUTATION_PROCESS_EXIT', broken.returncode, flush=True)
          assert broken.returncode == 3
          assert '"name": "closure_guards_39", "ok": false' in broken.stdout
          spec = importlib.util.spec_from_file_location('cierre', root / 'reuso_cierre.py')
          c = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(c)
          for planted in (True, False):
              d = c.prepare_cierre(c.estricto.fixture(planted))
              obs = c.base.estadisticas(d, d['post'])
              target = {}
              file = pathlib.Path(tempfile.mkdtemp(prefix='cierre-checkpoint-')) / 'checkpoint.json'
              c.run_cierre('flywire', d, obs, target, False, lambda: c.estricto.checkpoint(file, target))
              assert c.estricto.complete_plan(target['nulls'], 200) and target['nonfrozen']
              ps = target['p'] * 2
              adj = c.base.holm(ps)
              verdict = c.base.veredicto_conectoma(ps[:2], adj[:2])
              expected = 'SOSTENIDA' if planted else 'REFUTADA'
              assert verdict == expected, verdict
              c.emit('SYNTHETIC_END_TO_END', dict(planted=planted, verdict=verdict, p=ps, holm=adj.tolist(), nulls=len(target['nulls']), checkpoint=file.exists()))
          print('E2E_POSITIVE_AND_NEGATIVE_PASS', flush=True)
          PY
          curl --fail --silent --show-error --location --max-time 180 --retry 2 --output /tmp/reuso-input/connectivity.parquet 'https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Connectivity_783.parquet'
          curl --fail --silent --show-error --location --max-time 180 --retry 2 --output /tmp/reuso-input/annotations.tsv 'https://raw.githubusercontent.com/flyconnectome/flywire_annotations/17fc57722002e1a7d38cdd0c89ac382bf92718da/supplemental_files/Supplemental_file1_neuron_annotations.tsv'
          curl --fail --silent --show-error --location --max-time 180 --retry 2 --output /tmp/reuso-input/banc_888_meta.feather 'https://storage.googleapis.com/lee-lab_brain-and-nerve-cord-fly-connectome/compiled_data/banc_888/banc_888_meta.feather'
          curl --fail --silent --show-error --location --max-time 180 --retry 2 --output /tmp/reuso-input/banc_888_edgelist_simple_v3.feather 'https://storage.googleapis.com/lee-lab_brain-and-nerve-cord-fly-connectome/compiled_data/banc_888/banc_888_edgelist_simple_v3.feather'
          python tools/reuso/reuso_cierre.py --mode full --inputs-dir /tmp/reuso-input --out "$D/cierre.json"
          printf 'UTC_END '; date -u --iso-8601=seconds
      - name: Conservar evidencia cruda aun si falla el ensayo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess
          directory = pathlib.Path('results/reuso_cierre_2026-11-01')
          directory.mkdir(parents=True, exist_ok=True)
          log = directory / ('run-' + os.environ['GITHUB_RUN_ID'] + '.log')
          result = directory / 'cierre.json'
          if not log.is_file():
              log.write_text('NO_MEDIDO: no instrument log was produced in this job\n')
          files = [str(log)] + ([str(result)] if result.is_file() else [])
          subprocess.run(['git', 'add', '--'] + files, check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed = {str(log), str(result)}
          assert set(changed).issubset(allowed), changed
          if not changed:
              print('No new evidence to publish')
              raise SystemExit(0)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898333+github-actions[bot]@users.noreply.github.com'], check=True)
          seal = pathlib.Path('tools/reuso/SELLO-CIERRE-2026-11-01.md').read_text()
          doc = next(line[5:] for line in seal.splitlines() if line.startswith('Doc: '))
          message = '\n'.join([
              'medicion(reuso-cierre): conservar la salida sin sustituirla por un resumen',
              '', '--- METODO PROMETEO ---',
              'Accion delicada: NO, evidencia en rama experimental; sin merge.',
              'Modo aplicado: FULL. El resultado cientifico esta en cierre.json, no en el exit del job.',
              'Maquina: Actions x64. QA de resultados pendiente de relectura.',
              'Instrumento: tools/reuso/reuso_cierre.py; salida cruda ' + str(log) + '.',
              'Fuente: ' + os.environ['GITHUB_SHA'],
              'Run: https://github.com/gatehot59-star/drosophila-fep-connectome/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'Artefactos: ' + str(result) + ' + ' + doc,
          ])
          subprocess.run(['git', 'commit', '-m', message], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/titan/reuso-cierre-2026-11-01'], check=True)
          PY
