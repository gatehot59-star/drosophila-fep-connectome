name: rival-mosca
# Respuesta 2026-10-14-033. H_RIVAL sellado (tools/rival/SELLO-RIVAL.md, 05a574c): 6 trabajos, uno por celda (los tres
# rivales con 10 candidatas cada uno, elegidos por validacion cruzada, medidos en las pruebas 2 a 21), CONTROL_RIDGE_015
# y el agregador sellado. Solo se dispara al pushear results/rival_2026-10-15/CORRER en esta rama.
on:
  push:
    branches: ["titan/rival-2026-10-15"]
    paths: ["results/rival_2026-10-15/CORRER"]
  workflow_dispatch:
permissions:
  contents: write
env:
  DEPS: numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 pyarrow==25.0.1
  CONN_URL: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Connectivity_783.parquet
  ANNOT_URL: https://raw.githubusercontent.com/flyconnectome/flywire_annotations/17fc57722002e1a7d38cdd0c89ac382bf92718da/supplemental_files/Supplemental_file1_neuron_annotations.tsv
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        parte: [c0, c1, c2, c3, c4, c5, r015]
        include:
          - {parte: c0, celda: "0.0|0.15"}
          - {parte: c1, celda: "0.0|0.45"}
          - {parte: c2, celda: "0.3|0.15"}
          - {parte: c3, celda: "0.3|0.45"}
          - {parte: c4, celda: "0.6|0.15"}
          - {parte: c5, celda: "0.6|0.45"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: medir
        shell: bash
        run: |
          set -o pipefail
          python -m pip install $DEPS
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          mkdir -p /tmp/in out
          python -m pip freeze > out/versiones_${{ matrix.parte }}.txt
          curl -fsSL -o /tmp/in/connectivity.parquet "$CONN_URL"
          curl -fsSL -o /tmp/in/annotations.tsv "$ANNOT_URL"
          md5sum /tmp/in/connectivity.parquet /tmp/in/annotations.tsv >> out/versiones_${{ matrix.parte }}.txt
          if [ "${{ matrix.parte }}" = "r015" ]; then
            python tools/rival/rival_mosca.py --conn /tmp/in/connectivity.parquet --annot /tmp/in/annotations.tsv --out out --solo_015 2>&1 | tee out/rival_r015.log
          else
            python tools/rival/rival_mosca.py --conn /tmp/in/connectivity.parquet --annot /tmp/in/annotations.tsv --out out --celda "${{ matrix.celda }}" 2>&1 | tee out/rival_${{ matrix.parte }}.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rival-${{ matrix.parte }}
          path: out/
  agregar:
    needs: [medir]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: rival-*
          path: art
      - name: agregar y commitear
        shell: bash
        run: |
          set -o pipefail
          python -m pip install numpy==2.5.3
          D=results/rival_2026-10-15
          mkdir -p "$D"
          cp art/*/*.log art/*/*.txt art/*/*.json "$D"/ 2>/dev/null || true
          python tools/rival/agregar_rival.py --dir "$D" 2>&1 | tee "$D"/agregado.log
          (cd "$D" && md5sum *.log *.txt *.json > MD5SUMS.txt || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -m "medicion(2026-10-14-033): H_RIVAL en Actions x64, 6 celdas, CONTROL_RIDGE_015 y agregado" || echo nada_que_commitear
          git pull --rebase origin titan/rival-2026-10-15 || true
          git push origin HEAD:titan/rival-2026-10-15
